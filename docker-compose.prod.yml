services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schichtmeister-app
    # No published port: Nginx Proxy Manager reaches the app over the shared "proxy" network.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@schichtmeister-postgres:5432/${POSTGRES_DB}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - SOLVER_URL=http://schichtmeister-solver:8000
    depends_on:
      schichtmeister-postgres:
        condition: service_healthy
      schichtmeister-solver:
        condition: service_healthy
    networks:
      - schichtmeister_network
      - proxy
    restart: unless-stopped

  schichtmeister-solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
      # Avoid re-pulling python:3.12-slim on every deploy; new digest invalidates apt/pip layers.
      pull: false
    container_name: schichtmeister-solver
    networks:
      - schichtmeister_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  schichtmeister-postgres:
    image: postgres:16-alpine
    container_name: schichtmeister-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - schichtmeister_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - schichtmeister_network
    restart: unless-stopped

networks:
  schichtmeister_network:
    name: schichtmeister_network
    driver: bridge
  # Shared with the reverse proxy (Nginx Proxy Manager), created outside this file.
  proxy:
    external: true

volumes:
  schichtmeister_postgres_data:
    name: schichtmeister_postgres_data
