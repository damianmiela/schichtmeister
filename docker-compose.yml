# Local run: `docker compose up -d --build`, then once `docker compose run --rm setup`
# for the tables and the demo data. The app is then at http://localhost:3000.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      solver:
        condition: service_healthy
    restart: unless-stopped

  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: schichtmeister-postgres-dev
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-off: creates the tables and loads the demo data (running it again resets them).
  setup:
    image: node:22-alpine
    profiles: ["setup"]
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "apk add --no-cache openssl >/dev/null && npm ci --no-audit --no-fund && npx prisma migrate deploy && npx prisma db seed"

volumes:
  # Explicit name so local/dev compose never mounts production data (schichtmeister_postgres_data).
  postgres_data:
    name: schichtmeister_postgres_dev_data
